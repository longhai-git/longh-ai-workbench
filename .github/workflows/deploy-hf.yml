name: Deploy to Hugging Face Spaces

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  HF_SPACE_NAME: longh-ai-workbench

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create or update HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          
          api = HfApi(token=os.environ['HF_TOKEN'])
          user = api.whoami()['name']
          space_id = f"{user}/longh-ai-workbench"
          
          try:
              api.create_repo(repo_id=space_id, repo_type='space', space_sdk='docker', exist_ok=True)
              print(f'Space ready: {space_id}')
          except Exception as e:
              print(f'Space creation result: {e}')
          
          print(f'Space URL: https://huggingface.co/spaces/{space_id}')
          PYEOF

      - name: Prepare files for HF Space
        run: |
          # Copy README_HF.md as README.md for the Space
          cp README_HF.md README.md
          
          # Set PORT to 7860 in a .env file for HF
          echo 'PORT=7860' > .env.hf

      - name: Upload to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          
          api = HfApi(token=os.environ['HF_TOKEN'])
          user = api.whoami()['name']
          space_id = f"{user}/longh-ai-workbench"
          
          # Upload all files (excluding .git, node_modules, etc.)
          api.upload_folder(
              folder_path='.',
              repo_id=space_id,
              repo_type='space',
              ignore_patterns=['.git/*', 'node_modules/*', '*/node_modules/*', '.env', '*.log'],
              commit_message='Deploy from GitHub Actions'
          )
          
          # Set environment variables as secrets
          secrets = {
              'PORT': '7860',
              'NODE_ENV': 'production',
              'JWT_SECRET': 'longh-ai-workbench-jwt-secret-2024',
              'TURSO_DATABASE_URL': 'libsql://workbench-longh-ai.aws-ap-northeast-1.turso.io',
              'TURSO_AUTH_TOKEN': os.environ.get('TURSO_AUTH_TOKEN', ''),
              'UPLOAD_DIR': '/app/server/uploads',
          }
          
          for key, value in secrets.items():
              if value:
                  try:
                      api.add_space_secret(repo_id=space_id, key=key, value=value)
                      print(f'Set secret: {key}')
                  except Exception as e:
                      print(f'Secret {key}: {e}')
          
          print(f'\n✅ Deployment complete!')
          print(f'Space URL: https://{user}-longh-ai-workbench.hf.space')
          PYEOF
