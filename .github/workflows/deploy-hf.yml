on:
  workflow_dispatch:

env:
  HF_SPACE_NAME: longh-ai-workbench
  TURSO_AUTH_TOKEN: eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODkxMDYxNzEsImlkIjoiMDFhMDhmMDktNDIwMS03NzFlLWE4NDgtYTdjYzA4YjNjNGM1Iiwia2lkIjoidlJDemg0QUhFODFPZWMyWWI4RGQ3Sk9qblVYX0pCZk1CTEY2NGZ0YnkxZyIsInJpZCI6IjVjNThjNzM3LTM4NGQtNGE1ZS1iOWVmLTNkYWJmODVjNTc0OCJ9.LKvY5HCEznFv7swMsTxMMwvKJ6NR0UGjUpydb43B30ctMKg012sko_HOc4YSHyvtJsfDfFxlBXvcRjMkn_ipBA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Create HF Space and deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          
          token = os.environ['HF_TOKEN']
          turso_token = os.environ['TURSO_AUTH_TOKEN']
          
          api = HfApi(token=token)
          user = api.whoami()['name']
          space_id = f"{user}/longh-ai-workbench"
          
          # Create Space with Docker SDK
          try:
              api.create_repo(repo_id=space_id, repo_type='space', space_sdk='docker', exist_ok=True)
              print(f'Space created/verified: {space_id}')
          except Exception as e:
              print(f'Space creation: {e}')
          
          # Upload all files
          api.upload_folder(
              folder_path='.',
              repo_id=space_id,
              repo_type='space',
              ignore_patterns=['.git/*', 'node_modules/*', '*/node_modules/*', '.env', '*.log', '.github/*'],
              commit_message='Deploy LongH AI Workbench'
          )
          print('Files uploaded successfully')
          
          # Set environment variables as secrets
          secrets = {
              'PORT': '7860',
              'NODE_ENV': 'production',
              'JWT_SECRET': 'longh-ai-workbench-jwt-secret-2024',
              'TURSO_DATABASE_URL': 'libsql://workbench-longh-ai.aws-ap-northeast-1.turso.io',
              'TURSO_AUTH_TOKEN': turso_token,
              'UPLOAD_DIR': '/app/server/uploads',
          }
          
          for key, value in secrets.items():
              try:
                  api.add_space_secret(repo_id=space_id, key=key, value=value)
                  print(f'Set secret: {key}')
              except Exception as e:
                  print(f'Secret {key}: {e}')
          
          print(f'\n========================================')
          print(f'Deployment complete!')
          print(f'Space URL: https://{user}-longh-ai-workbench.hf.space')
          print(f'Direct URL: https://huggingface.co/spaces/{space_id}')
          print(f'========================================')
          PYEOF
