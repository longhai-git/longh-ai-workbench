# ==========================================================================
# Nginx 反向代理配置 - LongH AI Workbench
# ==========================================================================
# 用法:
#   1. 将此文件复制到 /etc/nginx/sites-available/workbench.conf
#   2. 修改 your-domain.com 为实际域名
#   3. ln -s /etc/nginx/sites-available/workbench.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
# ==========================================================================

# 限制上传文件大小
client_max_body_size 10m;

# 上游服务
upstream workbench_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name your-domain.com;
    
    # ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # --- SSL 证书（使用 Let's Encrypt）---
    # 用 certbot 自动生成: sudo certbot --nginx -d your-domain.com
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # --- 安全头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 上传文件大小限制 ---
    client_max_body_size 10m;

    # --- 静态文件上传目录 ---
    location /uploads/ {
        proxy_pass http://workbench_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- API 反代 ---
    location /api/ {
        proxy_pass http://workbench_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- 前端静态资源 ---
    location / {
        proxy_pass http://workbench_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket 支持（如有需要）---
    location /ws {
        proxy_pass http://workbench_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # --- 压缩 ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
